name: Docker Image CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # PR のときは「master にマージした結果」の仮想コミットを使う
      - uses: actions/checkout@v3
        if: ${{ github.event_name == 'pull_request' }}
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      # push のときは普通にそのコミットを使う
      - uses: actions/checkout@v3
        if: ${{ github.event_name != 'pull_request' }}
        with:
          ref: ${{ github.sha }}

      # arm64 イメージを amd64 のランナーでビルドするために QEMU を登録する
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build the Docker image (standard)
        run: ./build.sh latest

      - name: Build the Docker image (open-appsec)
        run: ./build.sh --openappsec latest

